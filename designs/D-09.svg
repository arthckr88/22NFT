<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100">
  <rect width="100%" height="100%" fill="#f6f3ec"/>
  <text x="48" y="42" fill="#8c2f2f" font-family="ui-sans-serif,sans-serif" font-size="15" font-weight="700">CONCEPT — NOT FOR FABRICATION UNTIL FIELD-MEASURED.</text>
  <text x="48" y="68" fill="#3d3832" font-family="ui-sans-serif,sans-serif" font-size="22" font-weight="700">D-09 — Exterior storage map</text>
  
    <g font-family="ui-sans-serif,sans-serif" font-size="13" fill="#2c2824">
      <text x="48" y="104">Every bay below is a slot, not a measured compartment. Assignments move after the tape. Nothing here is a claim that the coach has six doors.</text>
      <text x="48" y="150" font-weight="700">Proposed contents — swap freely</text>
    </g>
    <rect x="48" y="180" width="700" height="120" fill="#efe8dc" stroke="#2c2824"/><text x="64" y="212" font-family="ui-sans-serif,sans-serif" font-size="16" font-weight="700" fill="#2c2824">Bay A</text><text x="64" y="238" font-family="ui-sans-serif,sans-serif" font-size="13" fill="#5c564e">UNVERIFIED door</text><text x="64" y="268" font-family="ui-sans-serif,sans-serif" font-size="15" fill="#2c2824">Sewer hoses, gloves, fittings</text>
<rect x="808" y="180" width="700" height="120" fill="#efe8dc" stroke="#2c2824"/><text x="824" y="212" font-family="ui-sans-serif,sans-serif" font-size="16" font-weight="700" fill="#2c2824">Bay B</text><text x="824" y="238" font-family="ui-sans-serif,sans-serif" font-size="13" fill="#5c564e">UNVERIFIED door</text><text x="824" y="268" font-family="ui-sans-serif,sans-serif" font-size="15" fill="#2c2824">Fresh hose, pressure regulator</text>
<rect x="48" y="320" width="700" height="120" fill="#efe8dc" stroke="#2c2824"/><text x="64" y="352" font-family="ui-sans-serif,sans-serif" font-size="16" font-weight="700" fill="#2c2824">Bay C</text><text x="64" y="378" font-family="ui-sans-serif,sans-serif" font-size="13" fill="#5c564e">UNVERIFIED door</text><text x="64" y="408" font-family="ui-sans-serif,sans-serif" font-size="15" fill="#2c2824">Fiat tow bar, base-plate tools</text>
<rect x="808" y="320" width="700" height="120" fill="#efe8dc" stroke="#2c2824"/><text x="824" y="352" font-family="ui-sans-serif,sans-serif" font-size="16" font-weight="700" fill="#2c2824">Bay D</text><text x="824" y="378" font-family="ui-sans-serif,sans-serif" font-size="13" fill="#5c564e">UNVERIFIED door</text><text x="824" y="408" font-family="ui-sans-serif,sans-serif" font-size="15" fill="#2c2824">Supplemental brake, lighting cable</text>
<rect x="48" y="460" width="700" height="120" fill="#efe8dc" stroke="#2c2824"/><text x="64" y="492" font-family="ui-sans-serif,sans-serif" font-size="16" font-weight="700" fill="#2c2824">Bay E</text><text x="64" y="518" font-family="ui-sans-serif,sans-serif" font-size="13" fill="#5c564e">UNVERIFIED door</text><text x="64" y="548" font-family="ui-sans-serif,sans-serif" font-size="15" fill="#2c2824">Leveling blocks, chocks</text>
<rect x="808" y="460" width="700" height="120" fill="#efe8dc" stroke="#2c2824"/><text x="824" y="492" font-family="ui-sans-serif,sans-serif" font-size="16" font-weight="700" fill="#2c2824">Bay F</text><text x="824" y="518" font-family="ui-sans-serif,sans-serif" font-size="13" fill="#5c564e">UNVERIFIED door</text><text x="824" y="548" font-family="ui-sans-serif,sans-serif" font-size="15" fill="#2c2824">Spare parts, fuses, fluids</text>
<rect x="48" y="600" width="700" height="120" fill="#efe8dc" stroke="#2c2824"/><text x="64" y="632" font-family="ui-sans-serif,sans-serif" font-size="16" font-weight="700" fill="#2c2824">Pass-through</text><text x="64" y="658" font-family="ui-sans-serif,sans-serif" font-size="13" fill="#5c564e">RV Guide says standard</text><text x="64" y="688" font-family="ui-sans-serif,sans-serif" font-size="15" fill="#2c2824">Long items — size UNKNOWN</text>
<rect x="808" y="600" width="700" height="120" fill="#efe8dc" stroke="#2c2824"/><text x="824" y="632" font-family="ui-sans-serif,sans-serif" font-size="16" font-weight="700" fill="#2c2824">Step well</text><text x="824" y="658" font-family="ui-sans-serif,sans-serif" font-size="13" fill="#5c564e">Factory 12 V option</text><text x="824" y="688" font-family="ui-sans-serif,sans-serif" font-size="15" fill="#2c2824">Do not plan B4810s here</text>
<rect x="48" y="740" width="700" height="120" fill="#efe8dc" stroke="#2c2824"/><text x="64" y="772" font-family="ui-sans-serif,sans-serif" font-size="16" font-weight="700" fill="#2c2824">Tail box</text><text x="64" y="798" font-family="ui-sans-serif,sans-serif" font-size="13" fill="#5c564e">New, option b</text><text x="64" y="828" font-family="ui-sans-serif,sans-serif" font-size="15" fill="#2c2824">Two B4810, maybe the hub</text>
<rect x="808" y="740" width="700" height="120" fill="#efe8dc" stroke="#2c2824"/><text x="824" y="772" font-family="ui-sans-serif,sans-serif" font-size="16" font-weight="700" fill="#2c2824">Generator bay</text><text x="824" y="798" font-family="ui-sans-serif,sans-serif" font-size="13" fill="#5c564e">Location UNKNOWN</text><text x="824" y="828" font-family="ui-sans-serif,sans-serif" font-size="15" fill="#2c2824">Keep the exhaust clear</text><text x="48" y="900" font-family="ui-sans-serif,sans-serif" font-size="13" fill="#2c2824">If option f converts a bay into a battery locker, remove that bay from this list before the hoses have nowhere to go. Spare tire access stays clear unless option c relocates it off the hitch.</text>
  
    <rect x="36" y="1000" width="1528" height="72" fill="#1c1915" />
    <text x="52" y="1028" fill="#f4efe6" font-family="ui-sans-serif,sans-serif" font-size="16" font-weight="700">22NFT BUILD</text>
